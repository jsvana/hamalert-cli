[package]
name = "hamalert-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
dirs = "5.0"
chrono = "0.4"
inquire = "0.7"
keyring = "4.1.2"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = [
    "charset",
    "cookies",
    "http2",
    "json",
    "rustls-tls-native-roots",
    "system-proxy",
]
